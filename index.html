<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NoteStarOS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Status Bar -->
    <div id="top-bar">
        <span id="welcomeopen" class="os-logo">NoteStarOS</span>
        <span id="timeElement"></span>
    </div>

    <!-- Desktop Icons Area -->
    <div id="desktopApps">
        <div class="app-icon" id="notesOpen">
            <img src="https://img.magnific.com/premium-vector/sn-beauty-product-luxury-logo-design_745595-730.jpg?semt=ais_hybrid&w=740&q=80" alt="Notes">
            <span>Notes</span>
        </div>
        
        <div class="app-icon" id="calcOpen">
            <div class="calc-icon-placeholder">🧮</div>
            <span>Calculator</span>
        </div>
    </div>

    <!-- Welcome Window -->
    <div id="welcomeWindow" class="window">
        <div id="welcomeWindowHeader" class="window-header">
            <span>Welcome to NoteStarOS</span>
            <button class="control-btn close-btn" id="welcomeclose">×</button>
        </div>
        <div class="window-body">
            <h1>NoteStarOS</h1>
            <p>Welcome to your distraction-free desktop environment for writing and organizing notes.</p>
        </div>
    </div> 

    <!-- Notes Window -->
    <div id="myNote" class="window">
        <div id="myNoteHeader" class="window-header">
            <span>Notes</span>
            <div class="window-controls">
                <button class="control-btn close-btn" id="notesClose">×</button>
            </div>
        </div>
        <div class="window-body note-body">
            <div class="notes-toolbar">
                <button id="clearNoteBtn">Clear Text</button>
            </div>
            <textarea id="notesArea" class="note-textarea" placeholder="Start typing your note here..."></textarea>
        </div>
    </div>

    <!-- Calculator Window -->
    <div id="myCalc" class="window">
        <div id="myCalcHeader" class="window-header">
            <span>Calculator</span>
            <div class="window-controls">
                <button class="control-btn close-btn" id="calcClose">×</button>
            </div>
        </div>
        <div class="window-body calc-body">
            <input type="text" id="calcScreen" readonly value="0">
            <div class="calc-grid">
                <button onclick="clearCalc()" class="calc-btn action">C</button>
                <button onclick="deleteCalc()" class="calc-btn action">DEL</button>
                <button onclick="appendCalc('/')" class="calc-btn op">÷</button>
                <button onclick="appendCalc('*')" class="calc-btn op">×</button>
                
                <button onclick="appendCalc('7')" class="calc-btn">7</button>
                <button onclick="appendCalc('8')" class="calc-btn">8</button>
                <button onclick="appendCalc('9')" class="calc-btn">9</button>
                <button onclick="appendCalc('-')" class="calc-btn op">-</button>
                
                <button onclick="appendCalc('4')" class="calc-btn">4</button>
                <button onclick="appendCalc('5')" class="calc-btn">5</button>
                <button onclick="appendCalc('6')" class="calc-btn">6</button>
                <button onclick="appendCalc('+')" class="calc-btn op">+</button>
                
                <button onclick="appendCalc('1')" class="calc-btn">1</button>
                <button onclick="appendCalc('2')" class="calc-btn">2</button>
                <button onclick="appendCalc('3')" class="calc-btn">3</button>
                <button onclick="calculateResult()" class="calc-btn equal span-2-v">=</button>
                
                <button onclick="appendCalc('0')" class="calc-btn span-2">0</button>
                <button onclick="appendCalc('.')" class="calc-btn">.</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
